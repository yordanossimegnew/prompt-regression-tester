# Runs on every PR that touches a prompt or a suite: validates the files, compares the
# previous and latest prompt versions, posts the report as a PR comment, and fails the
# check if a regression is found.
name: Prompt regression

on:
  pull_request:
    paths:
      - "prompts/**"
      - "suites/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: prt
          POSTGRES_PASSWORD: prt
          POSTGRES_DB: prompt_regression
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prt -d prompt_regression"
          --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: postgresql://prt:prt@localhost:5432/prompt_regression
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate prompts and suites
        run: python main.py validate
      - name: Compare previous vs latest prompt versions
        id: run
        run: |
          status=0
          : > report.md
          for suite in suites/*.yaml; do
            name=$(basename "$suite" .yaml)
            python main.py run --suite "$name" --report "report-$name.md" || status=$?
            cat "report-$name.md" >> report.md 2>/dev/null; echo >> report.md
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = require('fs').readFileSync('report.md', 'utf8');
            await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});
      - name: Fail on regression
        if: steps.run.outputs.status != '0'
        run: exit 1
